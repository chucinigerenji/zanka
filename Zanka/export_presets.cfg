; 《残夏 -The Last Tide-》导出预设
;
; 由 DSH 依据工程实际资源结构生成（Godot 4.x 格式）。
; 关键设定与理由：
;   * export_filter="all_resources"        —— 背景/CG/立绘/音频/字体/JSON 全部按资源导出
;   * include_filter="data/story/*.json"   —— 显式钉住剧本包。main.zs 没有 ResourceFormatLoader，
;                                             导出后不会进 APK；运行时读的是 pack_story.py 产出的
;                                             main.json（scripts/main.gd: story_path() 优先取 json）
;   * exclude_filter="预览/*"              —— 预览/ 里的三张总览图约 7 MB（而且是成对的重复文件），
;                                             只是审稿用素材，不该进包
;   * architectures 只留 arm64-v8a         —— 现代手机全部是 arm64，砍掉 armeabi-v7a/x86 可把包体减半
;   * screen/immersive_mode=true           —— 视觉小说，全屏沉浸（隐藏导航栏）
;
; 导出前必须先跑：python3 tools/pack_story.py
; （validate.py 会校验 main.json 与 main.zs 是否同步，不同步直接报错）

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/story/*.json"
exclude_filter="预览/*"
export_path="build/Zanka.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

